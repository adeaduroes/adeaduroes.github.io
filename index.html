<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
</head>
<body>
<p id="m">Redirecting…</p>
<script id="maria-links" type="application/json">{"beef-dorito-casserole":"https://janetdishes.com/beef-dorito-casserole/","beefy-cheesy-fries-burrito-ultimate-loaded-flavor-wrap":"https://janetdishes.com/beefy-cheesy-fries-burrito-ultimate-loaded-flavor-wrap/","brown-gravy-smothered-hamburger-steaks":"https://janetdishes.com/brown-gravy-smothered-hamburger-steaks/","cajun-beef-spaghetti-in-creamy-three-cheese-parmesan-sauce":"https://janetdishes.com/cajun-beef-spaghetti-in-creamy-three-cheese-parmesan-sauce/","cajun-cream-cheese-alfredo-bowties-with-spiced-ground-beef":"https://janetdishes.com/cajun-cream-cheese-alfredo-bowties-with-spiced-ground-beef/","cattle-drive-casserole":"https://janetdishes.com/cattle-drive-casserole/","cheddar-bay-ground-beef-cobbler":"https://janetdishes.com/cheddar-bay-ground-beef-cobbler/","cheesy-beef-frozen-potato-casserole":"https://janetdishes.com/cheesy-beef-frozen-potato-casserole/","cheesy-beef-broccoli-and-rice":"https://janetdishes.com/cheesy-beef-broccoli-and-rice/","cheesy-beef-chimichangas":"https://janetdishes.com/cheesy-beef-chimichangas/"}</script>
<script>
(function () {
  var links = JSON.parse(document.getElementById("maria-links").textContent);
  var parts = location.search.replace(/^\?/, "").split("&");
  var slug = "";
  try { slug = decodeURIComponent(parts.shift() || ""); } catch (e) {}
  slug = slug.toLowerCase().replace(/\/+$/, "");
  var to = links[slug];
  if (!to) { document.title = "Page not found"; document.getElementById("m").textContent = "Page not found."; return; }
  var extra = parts.filter(Boolean).join("&");
  if (extra) {
    var h = to.indexOf("#"), hash = h < 0 ? "" : to.slice(h), u = h < 0 ? to : to.slice(0, h);
    to = u + (u.indexOf("?") < 0 ? "?" : "&") + extra + hash;
  }
  location.replace(to);
})();
</script>
</body>
</html>
